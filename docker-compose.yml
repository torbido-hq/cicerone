version: "3.9"

# Cicerone — a generic, low-volume batch recommender (rectools + LightFM).
# Everything about how it's wired up (input/output backend, tuning,
# scheduling) lives in config/cicerone.toml — see README.md. This file only
# supplies the secrets that cicerone.toml references via ${...} placeholders
# (set them in .env, see .env.example).
#
# Services (same app image for the three app containers):
#   postgres    — optional local Postgres 16 for kind = "db" (compose profile
#                 "db"). Start with: docker compose --profile db up -d postgres
#                 Creates databases `cicerone` (app/tutorial) and
#                 `cicerone_test` (pytest). See CONTRIBUTING.md.
#   recommender — the batch training job (cron + optional event trigger,
#                 see [job.trigger] in config/cicerone.toml).
#   serve       — the lightweight read API over precomputed recommendations
#                 (config/cicerone.serve.toml, job.mode = "serve"). Optional:
#                 comment it out if you only need the batch job.
#   dashboard   — a small status page over job run history
#                 (config/cicerone.dashboard.toml). Optional: comment it out
#                 if you don't need it. Manage its login users with:
#                   docker compose run --rm dashboard \
#                     python -m cicerone.manage_dashboard_users add <username>
#
# Postgres is opt-in via --profile db so a host already using :5432 (or an
# S3/dataset-only setup) can still `docker compose up` without waiting on DB.

services:
  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicerone
      POSTGRES_PASSWORD: cicerone
      POSTGRES_DB: cicerone
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicerone -d cicerone"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    restart: unless-stopped

  recommender:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Rome"

      INPUT_S3_ENDPOINT_URL: ${INPUT_S3_ENDPOINT_URL:-}
      INPUT_S3_ACCESS_KEY_ID: ${INPUT_S3_ACCESS_KEY_ID:-}
      INPUT_S3_SECRET_ACCESS_KEY: ${INPUT_S3_SECRET_ACCESS_KEY:-}
      INPUT_S3_BUCKET: ${INPUT_S3_BUCKET:-}
      # Only set when using kind = "db" — leave unset by default so enabling
      # db in TOML without the postgres profile / .env cannot silently point
      # at a missing host. With --profile db, set in .env e.g.:
      #   INPUT_DATABASE_URL=postgresql+psycopg://cicerone:cicerone@postgres:5432/cicerone
      INPUT_DATABASE_URL: ${INPUT_DATABASE_URL:-}

      OUTPUT_S3_ENDPOINT_URL: ${OUTPUT_S3_ENDPOINT_URL:-}
      OUTPUT_S3_ACCESS_KEY_ID: ${OUTPUT_S3_ACCESS_KEY_ID:-}
      OUTPUT_S3_SECRET_ACCESS_KEY: ${OUTPUT_S3_SECRET_ACCESS_KEY:-}
      OUTPUT_S3_BUCKET: ${OUTPUT_S3_BUCKET:-}
      OUTPUT_DATABASE_URL: ${OUTPUT_DATABASE_URL:-}

      # Only used if config/cicerone.toml sets [job.trigger].enabled = true.
      TRIGGER_AUTH_TOKEN: ${TRIGGER_AUTH_TOKEN:-}
    ports:
      - "8080:8080" # only listens if [job.trigger].enabled = true
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  serve:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Rome"
      CICERONE_CONFIG_PATH: /app/config/cicerone.serve.toml

      OUTPUT_S3_ENDPOINT_URL: ${OUTPUT_S3_ENDPOINT_URL:-}
      OUTPUT_S3_ACCESS_KEY_ID: ${OUTPUT_S3_ACCESS_KEY_ID:-}
      OUTPUT_S3_SECRET_ACCESS_KEY: ${OUTPUT_S3_SECRET_ACCESS_KEY:-}
      OUTPUT_S3_BUCKET: ${OUTPUT_S3_BUCKET:-}
      # Unset by default — set in .env when serve reads a kind = "db" output.
      OUTPUT_DATABASE_URL: ${OUTPUT_DATABASE_URL:-}
      SERVE_AUTH_TOKEN: ${SERVE_AUTH_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "-m", "cicerone.dashboard"]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Rome"
      CICERONE_CONFIG_PATH: /app/config/cicerone.dashboard.toml

      OUTPUT_S3_ENDPOINT_URL: ${OUTPUT_S3_ENDPOINT_URL:-}
      OUTPUT_S3_ACCESS_KEY_ID: ${OUTPUT_S3_ACCESS_KEY_ID:-}
      OUTPUT_S3_SECRET_ACCESS_KEY: ${OUTPUT_S3_SECRET_ACCESS_KEY:-}
      OUTPUT_S3_BUCKET: ${OUTPUT_S3_BUCKET:-}
      # Unset by default — set in .env when the dashboard reads a kind = "db" output.
      OUTPUT_DATABASE_URL: ${OUTPUT_DATABASE_URL:-}
    ports:
      - "8090:8090"
    volumes:
      # Read-write (unlike recommender/serve above): `manage_dashboard_users`
      # (run via `docker compose run --rm dashboard python -m
      # cicerone.manage_dashboard_users add <username>`) writes
      # config/dashboard_users.toml here.
      - ./config:/app/config
    restart: unless-stopped

volumes:
  postgres_data:
