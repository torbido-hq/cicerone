# Keep dependency PRs small and reviewable. Cap open PRs so the queue
# does not grow unbounded; Dependabot opens the next after merges.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # LightFM / implicit wheels and CI image stay on the 1.x / pandas 2.x line.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # Docker / CI remain on Python 3.11; numpy>=2.5 needs Python>=3.12.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      # aiobotocore 3.9 pins botocore<1.43.57; boto3 must stay compatible.
      - dependency-name: "boto3"
        versions: [">=1.43.57"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Major Python version bumps require re-validating compiled ML deps
      # (rectools/lightfm/scipy pins) against the new interpreter first —
      # see PR #5, closed because rectools==0.13.0 has no 3.14 wheel/sdist
      # support. Bump these manually alongside the pinned deps in
      # requirements.txt instead of accepting an automated PR.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
