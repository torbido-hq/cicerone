# Keep dependency PRs small and reviewable. Cap open PRs so the queue
# does not grow unbounded; Dependabot opens the next after merges.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Bump the exact pins in requirements*.txt; widen a pyproject range only
    # when the new version falls outside it.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # rectools still requires pandas<3 (through 0.19.0). Stay on the latest
      # 2.x pin in requirements.txt until upstream supports pandas 3.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # Docker / CI remain on Python 3.11; numpy>=2.5 needs Python>=3.12.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      # scipy>=1.18 needs Python>=3.12 and numpy>=2. Stay on 1.17.x for 3.11 CI.
      - dependency-name: "scipy"
        versions: [">=1.18.0"]
      # pyarrow>=26 needs numpy>=2. Stay on 25.x while numpy is pinned to 1.26.
      - dependency-name: "pyarrow"
        versions: [">=26.0.0"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Major Python version bumps require re-validating compiled ML deps
      # (rectools/lightfm/scipy pins) against the new interpreter first —
      # see PR #5, closed because rectools==0.19.0 requires Python<3.14.
      # Bump these manually alongside the pinned deps in
      # requirements.txt instead of accepting an automated PR. Minor bumps
      # too: #419 (3.11 -> 3.15) failed because rectools==0.19.0 needs <3.14.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
