# Example "dashboard" configuration -- a small read-only status page over
# the job run history the batch job already writes (job runs on cron, see
# config/cicerone.toml). Deploy it as a separate container from the same
# image, pointed at this file via CICERONE_CONFIG_PATH (see the "dashboard"
# service in docker-compose.yml). Always its own process
# (`python -m cicerone.dashboard`), independent of [job].mode -- it never
# imports cicerone.model/dataset/automl (no rectools/lightfm/implicit
# needed here), same as serve mode.
#
# [output] here MUST point at the exact same store the batch job writes to
# (status history and the user-id inspector both read from it) -- everything
# else in this file is independent of the batch config.

[output]
kind = "dataset"

[output.options]
storage_backend = "s3" # "s3" | "local"
endpoint_url = "${OUTPUT_S3_ENDPOINT_URL}"
access_key_id = "${OUTPUT_S3_ACCESS_KEY_ID}"
secret_access_key = "${OUTPUT_S3_SECRET_ACCESS_KEY}"
bucket = "${OUTPUT_S3_BUCKET}"
prefix = "recommendations/latest"

[dashboard]
enabled = true
host = "0.0.0.0"
port = 8090
# HTTP Basic Auth users (username -> bcrypt hash), managed with:
#   docker compose run --rm dashboard python -m cicerone.manage_dashboard_users add <username>
# Meant for a handful of named people, not machine-to-machine access
# (compare to [serve].auth_token / [job.trigger].auth_token, a single
# shared bearer token for that use case).
users_path = "/app/config/dashboard_users.toml"
refresh_interval_seconds = 30 # how often the page polls /partials/status
history_limit = 20 # recent runs shown (only meaningful for [output].kind = "db")
lookup_k = 20 # inspector rows (capped at job.top_k)

# [job] is required by config.load_settings() even though the dashboard
# never trains anything -- kept generic/simple rather than special-casing
# it away. cron_schedule IS read (to compute whether the latest run looks
# overdue), so set it to the same schedule as the batch job's cicerone.toml.
[job]
cron_schedule = "0 3 * * *"

# [input] is likewise required but never read from in this mode -- any
# valid, already-configured backend works as a placeholder.
[input]
kind = "dataset"

[input.options]
storage_backend = "local"
path = "/tmp/unused-in-dashboard-mode"
