# Example "serve mode" configuration -- a second process (`cicerone serve`
# or the compose "serve" service) that only exposes the read API over the
# recommendations the batch job (using config/cicerone.toml) already wrote.
# Point it at this file via `--config` / CICERONE_CONFIG_PATH.
#
# [output] here MUST point at the exact same store the batch job writes to
# -- everything else in this file is independent of the batch config.
#
# Once running, try GET /docs (Swagger UI), GET /openapi.json, or the thin
# clients under examples/serve/ (and cicerone.serve_client.ServeClient).

[job]
mode = "serve"

[output]
kind = "dataset"

[output.options]
storage_backend = "s3" # "s3" | "local"
endpoint_url = "${OUTPUT_S3_ENDPOINT_URL}"
access_key_id = "${OUTPUT_S3_ACCESS_KEY_ID}"
secret_access_key = "${OUTPUT_S3_SECRET_ACCESS_KEY}"
bucket = "${OUTPUT_S3_BUCKET}"
prefix = "recommendations/latest"

[serve]
auth_token = "${SERVE_AUTH_TOKEN}"
host = "0.0.0.0"
port = 8000
default_k = 10
refresh_interval_seconds = 60
category_column = "category"
metrics_enabled = true
metrics_token = ""   # empty = open endpoint; bind to a trusted network or reverse proxy

# Optional incremental event ingest. See docs/incremental-events.md.
# Webhook: POST /events. DB: watermark poll. S3/R2: list/marker (or AWS SQS).
# Redis Streams: kind = "redis_streams" (`cicerone-recommender[redis]`).
# [events]
# enabled = true
# kind = "webhook"
# [events.options]
# # auth_token = "${EVENTS_AUTH_TOKEN}"
# # max_pending = 10000  # ingest 429 when full; must be >=100 (default 10000)
# [events.incremental]
# batch_size = 100
# batch_window_seconds = 60
# poll_interval_seconds = 1

# [input] is required by config.load_settings() even in serve mode (kept
# generic/simple rather than special-casing it away) but is never read from
# in this mode -- any valid, already-configured backend works as a placeholder.
[input]
kind = "dataset"

[input.options]
storage_backend = "local"
path = "/tmp/unused-in-serve-mode"
