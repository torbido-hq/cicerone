# Example "serve mode" configuration -- a second process (`cicerone serve`
# or the compose "serve" service) that only exposes the read API over the
# recommendations the batch job (using config/cicerone.toml) already wrote.
# Point it at this file via `--config` / CICERONE_CONFIG_PATH.
#
# [output] here MUST point at the exact same store the batch job writes to
# -- everything else in this file is independent of the batch config.
#
# Once running, try GET /docs (Swagger UI), GET /openapi.json, or the thin
# clients under examples/serve/ (and cicerone.serve_client.ServeClient).

[job]
mode = "serve"

[output]
kind = "dataset"

[output.options]
storage_backend = "s3" # "s3" | "local"
endpoint_url = "${OUTPUT_S3_ENDPOINT_URL}"
access_key_id = "${OUTPUT_S3_ACCESS_KEY_ID}"
secret_access_key = "${OUTPUT_S3_SECRET_ACCESS_KEY}"
bucket = "${OUTPUT_S3_BUCKET}"
prefix = "recommendations/latest"

[serve]
auth_token = "${SERVE_AUTH_TOKEN}"
host = "0.0.0.0"
port = 8000
default_k = 10
refresh_interval_seconds = 60
category_column = "category"
metrics_enabled = false
# metrics_token is required when metrics_enabled = true
# metrics_token = "${METRICS_TOKEN}"
# exclude_consumed = true   # hide items in [input] / incremental events
# fallback_fill = true      # fill short lists from popular/latest
# consumed_lookback = 1000

# Optional incremental event ingest. See docs/incremental-events.md.
# Webhook: POST /events. DB: watermark poll. S3/R2: list/marker (or AWS SQS).
# Redis Streams: kind = "redis_streams" (`cicerone-recommender[redis]`).
# Kafka: kind = "kafka" (`cicerone-recommender[kafka]`).
# RabbitMQ: kind = "rabbitmq" (`cicerone-recommender[rabbitmq]`).
# [events]
# enabled = true
# kind = "webhook"
# [events.options]
# # auth_token = "${EVENTS_AUTH_TOKEN}"
# # max_pending = 10000  # ingest 429 when full; must be >=100 (default 10000)
# [events.incremental]
# batch_size = 100
# batch_window_seconds = 60
# poll_interval_seconds = 1
# [events.online]
# enabled = true
# fit_partial_epochs = 1          # 0 = frozen weights + history refresh only
# fit_min_events = 100            # skip SGD until this many known-ID events
# max_extra_interactions = 50000  # online-only rows on top of the last job artifact

# Optional recs sidecar (batch job and incremental apply). Serve still reads [output].
# [publish]
# enabled = true
# kind = "kafka"
# [publish.options]
# bootstrap_servers = "${KAFKA_BOOTSTRAP_SERVERS}"
# topic = "cicerone.recommendations"

# Impression/click tracking (not used for training). See docs/evaluation.md.
# [track]
# enabled = true
# attribution_window_hours = 24
# conversion_event_types = ["purchase"]
# [serve]
# log_impressions = false         # GET lookup is not a view; host should POST /track

# [input] is required by config.load_settings() even in serve mode. Serve
# reads it for consumed-item hide (`[serve].exclude_consumed`). Point it at
# the live events store when you want GET /recommendations to drop
# just-purchased items.
[input]
kind = "dataset"

[input.options]
storage_backend = "local"
path = "/tmp/unused-in-serve-mode"
