# Cicerone configuration.
#
# Structural config. Mount into the image or pass `cicerone --config`.
# Host installs: set feature_config_path / users_path (defaults are /app/config/…).
# Secrets: "${ENV_VAR}" from the environment / .env; unset vars fail load.
# Literal "${…}": "$${NOT_A_VAR}".
#
# Input and output are each independently configurable. Every backend
# ("kind") interprets its own "options" table — see src/cicerone/io/ for the
# full list of options each one accepts. Built-in kinds:
#   "dataset" -> static parquet files, on S3-compatible object storage or a
#                local/mounted directory (src/cicerone/io/dataset_store.py)
#   "db"      -> a relational database table/query, via SQLAlchemy
#                (src/cicerone/io/db_store.py)

[job]
# "batch" (default): train on cron_schedule (below) + train_and_recommend,
# same as always. "serve": run the lightweight read API instead (see
# [serve] below) -- no training job runs in that mode/process.
mode = "batch" # "batch" | "serve"
top_k = 10
half_life_days = 90
cron_schedule = "0 3 * * *" # 5-field cron expression, evaluated in UTC
feature_config_path = "/app/config/features.toml"
# Recommendation strategies to fit and combine, in priority order (earlier
# entries win ties for the same user/item pair). Defaults to
# ["collaborative", "item_based", "popular"] if omitted. Available:
# "collaborative" (LightFM, hybrid CF), "item_based" (item-item KNN),
# "sequential" (SASRec / BERT4Rec; pip install 'cicerone-recommender[sequential]'
# or requirements-sequential.txt), "content_fallback" (feature similarity for
# zero-interaction items; also gated by [job.content_fallback].enabled),
# "popular" (global popularity fallback), "latest" (trending in the last two
# weeks). Sequential is opt-in (not in the default models list). Sequences
# are unique items ordered by last interaction (see README).
# models = ["collaborative", "item_based", "popular", "latest"]

# Optional: item-item KNN neighbor count (legacy → model.item_based.model.K).
# Prefer [model.item_based] below.
# [job.item_based]
# k_neighbors = 20

# Optional RecTools [model.<name>] tables (model_from_config; include cls).
# content_fallback stays under [job.content_fallback].
# [model.collaborative]
# cls = "LightFMWrapperModel"
# epochs = 30
# num_threads = 4
# [model.collaborative.model]
# no_components = 64
# loss = "warp"
# learning_rate = 0.05
# item_alpha = 1.0e-6
# user_alpha = 1.0e-6
# random_state = 42
#
# [model.item_based]
# cls = "ImplicitItemKNNWrapperModel"
# [model.item_based.model]
# cls = "TFIDFRecommender"
# K = 20
#
# [model.popular]
# cls = "PopularModel"
#
# [model.latest]
# cls = "PopularModel"
# popularity = "n_interactions"
# period = { days = 14 }
#
# Optional sequential strategy (SASRec default; BERT4Rec via architecture).
# Requires: pip install 'cicerone-recommender[sequential]'
# (or pip install -r requirements-sequential.txt from a checkout)
# [model.sequential]
# architecture = "sasrec"  # or "bert4rec"
# n_factors = 64
# epochs = 3
# loss = "softmax"
# session_max_len = 50
# train_min_user_interactions = 2
# batch_size = 128
# lr = 0.001
#
# AutoML skip when median distinct items/user is below this (default 5).
# [job.sequential]
# min_median_interactions = 5

# Optional: content-based cold-item tier. When enabled, inserted before the
# first non-personalized strategy (popular/latest) if not already listed in
# models. Recommends zero-interaction items by categorical feature similarity
# to each user's history. Independent of item_based.
# [job.content_fallback]
# enabled = false
# max_neighbors = 50

# Persist why each row was ranked (strategy contributions, boost hits, similar
# history items). Serve returns this as item.reasons. Default on.
# [job.explain]
# enabled = true
# max_similar_items = 3
# max_attributes = 5

# Optional: also write a versioned fitted-model artifact (model.artifact /
# model_artifacts table) alongside recommendations. Loadable later via
# cicerone.artifact without re-running training. Default false. Serve mode
# never loads this — it still reads precomputed recommendation rows only.
# save_model_artifact = false

# Optional: log in-sample Precision@K/Recall@K every N LightFM epochs while
# fitting the collaborative strategy (uses fit_partial epoch-by-epoch instead
# of a single fit). Adds training time — default off. Significant regression
# or plateau across logged epochs emits a WARN. The knobs below are ignored
# unless log_epoch_metrics is true (scored users are a seeded random sample).
# log_epoch_metrics = false
# epoch_metrics_every = 5
# epoch_metrics_max_users = 500
# epoch_metrics_regression_drop = 0.25
# epoch_metrics_plateau_eps = 0.01
# epoch_metrics_plateau_window = 3

# Parallelism for AutoML fold evaluation and strategy fitting (ProcessPool).
# Default 1. Set >1 when the host has spare cores.
# max_workers = 1

# Optional: combine the enabled strategies via weighted reciprocal rank
# fusion instead of the default priority order (personalized results win
# ties, non-personalized ones only backfill). If omitted, the priority
# combiner above is used. Every key must be one of the enabled "models".
# Note: an explicitly empty [job.model_weights] section still enables
# fusion mode, with every enabled strategy defaulting to weight 1.0.
#
# rrf_k tunes the reciprocal rank fusion constant used by model_weights
# (higher = lower ranks are discounted more gently). Only relevant when
# model_weights is set. Defaults to 60 (standard literature value).
# NOTE: rrf_k is a [job] key, so it must stay above [job.model_weights] —
# a bare key placed after a [table] header would be silently parsed as
# nested under that table instead of under [job].
# rrf_k = 60
# [job.model_weights]
# collaborative = 1.0
# item_based = 0.6
# popular = 0.3
# latest = 0.4

# Optional: instead of a fixed "models"/"model_weights" config, automatically
# backtest a set of candidate strategy/weight combinations over time-based
# folds of your own event history and pick the best one (by "primary_metric")
# for each run. Overrides "models"/"model_weights"/"rrf_k" above when enabled.
# [job.automl]
# enabled = true
# n_splits = 2       # number of time-based folds to backtest each candidate over
# test_days = 14     # size of each fold's held-out window, in days
# primary_metric = "MAP" # exact name, or a unique NAME@k (e.g. "MAP" → "MAP@10")
#
# Optional: override the default candidate search space (every strategy
# alone, the default priority combo, and a weighted-fusion blend). Each
# candidate is the same shape as "models"/"model_weights"/"rrf_k" above,
# except a candidate's "weights" table (if present) must give an explicit
# weight for every one of its "models" -- unlike "job.model_weights" above,
# there is no implicit default for an omitted model.
# [[job.automl.candidates]]
# models = ["popular"]
# [[job.automl.candidates]]
# models = ["collaborative", "item_based", "popular", "latest"]
# [job.automl.candidates.weights]
# collaborative = 1.0
# item_based = 0.7
# popular = 0.3
# latest = 0.3

# Optional: event-driven retraining, additive to cron_schedule above (both
# can fire; a run already in progress or started within debounce_seconds
# ignores/coalesces new triggers -- at most one run happens at a time).
# Runs in the same process as the cron loop (cicerone.scheduler).
# [job.trigger]
# enabled = true
# auth_token = "${TRIGGER_AUTH_TOKEN}" # required when enabled; checked as
#                                       # "Authorization: Bearer <token>"
# host = "0.0.0.0"
# port = 8080
# debounce_seconds = 60
# # POST /trigger/retrain on this port always works once trigger is enabled.
# # Additionally poll the *input* source for new/changed data and trigger a
# # run automatically (only supported for [input].kind = "dataset"; real S3
# # event notifications only deliver to SQS/SNS/Lambda and aren't portable
# # across S3-compatible backends, so polling is used instead):
# poll_input_bucket = false
# poll_interval_seconds = 300
# # Optional distributed lock for multiple scheduler replicas (default
# # "in_process" = single-instance threading.Lock, no extra infra).
# # Prefer "postgres" when you already have Postgres (reuses [output] db URL,
# # or set postgres_url). Use "redis" only for dataset/S3-only output that
# # needs HA (requires: pip install 'cicerone-recommender[redis]').
# # lock_backend = "in_process"  # "in_process" | "postgres" | "redis"
# # postgres_url = "${LOCK_DATABASE_URL}"  # optional override / non-db output
# # redis_url = "${REDIS_URL}"             # required when lock_backend = "redis"
# # lock_key = "cicerone:scheduler:run_guard"  # namespace Redis key / PG advisory hash
# # lock_ttl_seconds = 86400                   # Redis lock TTL (refreshed while held)

[input]
kind = "dataset"

[input.options]
storage_backend = "s3" # "s3" | "local"
endpoint_url = "${INPUT_S3_ENDPOINT_URL}"
access_key_id = "${INPUT_S3_ACCESS_KEY_ID}"
secret_access_key = "${INPUT_S3_SECRET_ACCESS_KEY}"
bucket = "${INPUT_S3_BUCKET}"
prefix = "datasets/latest"
# storage_backend = "local" instead uses a single "path" option, e.g.:
# storage_backend = "local"
# path = "/data/input"

[output]
kind = "dataset"

[output.options]
storage_backend = "s3" # "s3" | "local"
endpoint_url = "${OUTPUT_S3_ENDPOINT_URL}"
access_key_id = "${OUTPUT_S3_ACCESS_KEY_ID}"
secret_access_key = "${OUTPUT_S3_SECRET_ACCESS_KEY}"
bucket = "${OUTPUT_S3_BUCKET}"
prefix = "recommendations/latest"

# Only relevant when [job].mode = "serve": a lightweight read API over the
# top-K recommendations the batch job already wrote to [output] above (it
# reads that same store directly -- no model is loaded to serve requests).
# For [output].kind = "dataset", the whole recommendations file is cached
# in memory and reloaded every refresh_interval_seconds; for "db" it's
# queried directly on every request (already indexed by user_id).
# OpenAPI: GET /docs, /redoc, /openapi.json; thin clients in examples/serve/.
# Prefer config/cicerone.serve.toml for a standalone serve-only process.
# [serve]
# auth_token = "${SERVE_AUTH_TOKEN}" # required; checked as "Authorization: Bearer <token>"
# host = "0.0.0.0"
# port = 8000
# default_k = 10 # used when a request doesn't specify ?limit= / ?k=
# refresh_interval_seconds = 60
# category_column = "category" # items column used by ?category= filter

# Optional: ingest interaction events on the serve process for micro-batch
# incremental updates between full retrains (write-through to [output]).
# See docs/incremental-events.md. Webhook kind adds POST /events.
# Default is a single writer. Multi-replica apply: ha = true plus
# job.trigger.lock_backend = postgres|redis (leader-only writes).
# [events]
# enabled = true
# ha = false
# kind = "webhook"
# [events.options]
# # auth_token = "${EVENTS_AUTH_TOKEN}"  # optional; defaults to serve.auth_token
# # max_pending = 10000  # ingest 429 when full; must be >=100 (default 10000)
# [events.incremental]
# batch_size = 100
# batch_window_seconds = 60
# poll_interval_seconds = 1

# DB watermark source (no POST /events). Advances cursor only after a successful flush.
# [events]
# enabled = true
# kind = "db"
# [events.options]
# database_url = "${EVENTS_DATABASE_URL}"
# # events_table = "events"
# # events_query = "SELECT ... FROM ..."  # trusted deploy-time SELECT only
# # watermark_path = "/app/data/events_watermark.json"
# # initial_watermark = "2026-01-01T00:00:00Z"

# S3-compatible event source (R2-first). Same credential shape as [input]/
# list/marker under prefix; durable marker_path. Objects are JSON event
# objects or arrays. AWS SQS mode is optional and incompatible with endpoint_url.
# [events]
# enabled = true
# kind = "s3"
# [events.options]
# endpoint_url = "${EVENTS_S3_ENDPOINT_URL}"  # R2: https://<accountid>.r2.cloudflarestorage.com
# access_key_id = "${EVENTS_S3_ACCESS_KEY_ID}"
# secret_access_key = "${EVENTS_S3_SECRET_ACCESS_KEY}"
# bucket = "${EVENTS_S3_BUCKET}"
# prefix = "events/"
# mode = "list"
# marker_path = "/app/data/events_s3_marker.json"
# # list_page_size = 100
# # sqs_lag_cache_ttl_seconds = 5
# # sqs_client_timeout_seconds = 2
# # AWS-only alternative (no endpoint_url): mode = "sqs", queue_url = "..."

# Redis Streams (consumer group). Requires: pip install 'cicerone-recommender[redis]'
# [events]
# enabled = true
# kind = "redis_streams"
# [events.options]
# redis_url = "${REDIS_URL}"
# stream = "cicerone:events"
# consumer_group = "cicerone"
# # consumer_name = "serve-1"       # default: hostname
# # group_start_id = "0-0"
# # block_ms = 0
# # claim_idle_ms = 300000

# Optional: a small, standalone read-only status page over job run history
# (its own container/port, independent of [job].mode -- see the README's
# Dashboard section). Protected by HTTP Basic Auth (a handful of named
# users, see manage_dashboard_users) rather than a bearer token, since it's
# meant to be opened directly in a browser.
# [dashboard]
# enabled = true
# host = "0.0.0.0"
# port = 8090
# users_path = "/app/config/dashboard_users.toml"
# refresh_interval_seconds = 30 # how often the page polls /partials/status
# history_limit = 20 # recent runs shown (only meaningful for [output].kind = "db")
# lookup_k = 20 # inspector rows (capped at job.top_k)

# --- "db" kind example (commented out) ----------------------------------
# [input]
# kind = "db"
#
# [input.options]
# database_url = "${INPUT_DATABASE_URL}"
# # Table names default to cicerone.io.db_store.DEFAULT_* (events/users/items/…).
# events_table = "events"
# users_table = "users"
# items_table = "items"
# # Optional raw SQL overrides, e.g. to read straight from an application's
# # own schema instead of requiring materialized events/users/items tables:
# # events_query = "SELECT ... FROM analytics_events ..."
# # users_query = "SELECT ... FROM users ..."
# # items_query = "SELECT ... FROM products ..."
#
# [output]
# kind = "db"
#
# [output.options]
# database_url = "${OUTPUT_DATABASE_URL}"
# # Defaults: DEFAULT_RECOMMENDATIONS_TABLE / DEFAULT_MANIFEST_TABLE /
# # DEFAULT_MODEL_ARTIFACT_TABLE in cicerone.io.db_store.
# recommendations_table = "recommendations"
# manifest_table = "recommendation_runs"
# model_artifact_table = "model_artifacts"  # used when [job].save_model_artifact = true

