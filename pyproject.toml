[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicerone-recommender"
description = "Self-hosted batch recommender: hybrid models, policies, optional serve API and dashboard."
readme = "README.md"
license = "LicenseRef-Beerware"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
authors = [{ name = "Nicholas Wieland", email = "ngw@nofeed.org" }]
keywords = ["recommender", "recsys", "lightfm", "batch", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
# Compatible ranges; requirements*.txt pin the exact versions the image and CI install.
dependencies = [
    "rectools[lightfm]>=0.19.0,<0.20",
    "pm-implicit>=0.7.3,<0.8",
    "pandas>=2.3.3,<3",
    "numpy>=1.26.4,<2",
    "scipy>=1.17.1,<2",
    "scikit-learn>=1.9.1,<2",
    "boto3>=1.43.111,<2",
    "pyarrow>=25.0.1,<26",
    "SQLAlchemy>=2.1.4,<3",
    "psycopg[binary]>=3.3.6,<4",
    "croniter>=6.2.4,<7",
    "fastapi>=0.161.0,<0.163",
    "python-multipart>=0.0.32,<0.0.33",
    "uvicorn[standard]>=0.54.0,<0.55",
    "prometheus-client>=0.26.0,<0.27",
    "jinja2>=3.1.6,<4",
    "bcrypt>=5.0.0,<6",
]

[project.optional-dependencies]
redis = ["redis>=8.1.0,<9"]
sequential = ["rectools[torch]>=0.19.0,<0.20"]
kafka = ["confluent-kafka>=2.16.0,<3"]
rabbitmq = ["pika>=1.4.4,<2"]
bandits = ["mabwiser>=2.7.4,<3"]

[project.urls]
Homepage = "https://cicerone.dev"
Documentation = "https://cicerone.dev"
Repository = "https://github.com/torbido-hq/cicerone"
Changelog = "https://github.com/torbido-hq/cicerone/blob/main/CHANGELOG.md"
Issues = "https://github.com/torbido-hq/cicerone/issues"

[project.scripts]
cicerone = "cicerone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cicerone = ["static/**/*", "templates/**/*", "serve/python_detect.sh"]

[tool.setuptools.dynamic]
version = { attr = "cicerone.__version__" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
    "error:Settings\\.\\w+ is deprecated:FutureWarning",
    "error:make_settings\\(\\w+=\\.\\.\\.\\) is deprecated:FutureWarning",
]

[tool.coverage.run]
source = ["cicerone"]
omit = [
    "*/cicerone/io/base.py",
    "*/cicerone/events/base.py",
    "*/cicerone/__init__.py",
    "*/cicerone/io/__init__.py",
    "*/cicerone/events/__init__.py",
    "*/cicerone/publish/__init__.py",
    "*/cicerone/publish/base.py",
    "*/cicerone/model/__init__.py",
    "*/cicerone/config/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
