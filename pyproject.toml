[build-system]
requires = ["setuptools>=77.0.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicerone-recommender"
description = "Self-hosted batch recommender: hybrid models, policies, optional serve API and dashboard."
readme = "README.md"
license = "LicenseRef-Beerware"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
authors = [{ name = "Nicholas Wieland", email = "ngw@nofeed.org" }]
keywords = ["recommender", "recsys", "lightfm", "batch", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://cicerone.dev"
Documentation = "https://cicerone.dev"
Repository = "https://github.com/torbido-hq/cicerone"
Changelog = "https://github.com/torbido-hq/cicerone/blob/main/CHANGELOG.md"
Issues = "https://github.com/torbido-hq/cicerone/issues"

[project.scripts]
cicerone = "cicerone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cicerone = ["static/**/*", "templates/**/*"]

[tool.setuptools.dynamic]
version = { attr = "cicerone.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
redis = { file = ["requirements-redis.txt"] }
sequential = { file = ["requirements-sequential.txt"] }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["cicerone"]
omit = [
    "*/cicerone/io/base.py",
    "*/cicerone/events/base.py",
    "*/cicerone/__init__.py",
    "*/cicerone/io/__init__.py",
    "*/cicerone/events/__init__.py",
    "*/cicerone/model/__init__.py",
    "*/cicerone/config/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
