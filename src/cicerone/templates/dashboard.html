<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cicerone — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/cicerone-icon.svg">
  <link rel="stylesheet" href="/static/tailwind.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/stimulus.umd.js"></script>
  <script src="/static/dashboard.js"></script>
</head>
<body class="h-full">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-10 focus:rounded focus:bg-white focus:px-3 focus:py-2 focus:text-sm focus:text-slate-800">
    Skip to content
  </a>
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-4xl px-4 py-3 flex items-center gap-4">
      <h1><img src="/static/cicerone-logo.svg" alt="Cicerone" class="h-12 w-auto"></h1>
      <p class="text-sm text-slate-600 border-l border-slate-200 pl-4">Recommendation job status</p>
    </div>
  </header>
  <main id="main" class="mx-auto max-w-4xl px-4 py-6">
    <section class="rounded-lg border border-slate-200 bg-white p-4 mb-4" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading" class="text-sm font-medium text-slate-800 mb-3">Look up recommendations</h2>
      <form
        action="/dashboard"
        method="get"
        class="flex flex-wrap items-end gap-2"
        data-lookup-form
        hx-get="/partials/recommendations"
        hx-target="#recommendation-results"
        hx-swap="innerHTML show:none"
        hx-disabled-elt="button[type='submit']"
      >
        <div class="flex min-w-0 flex-1 flex-col gap-1">
          <label for="user-id" class="text-sm text-slate-700">User id</label>
          <input
            id="user-id"
            type="search"
            name="user_id"
            value="{{ user_id }}"
            placeholder="e.g. alice"
            required
            autocomplete="off"
            spellcheck="false"
            class="w-full rounded border border-slate-300 px-3 py-1.5 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-800 focus-visible:ring-offset-2"
          >
        </div>
        <button
          type="submit"
          class="rounded bg-slate-800 px-3 py-1.5 text-sm text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-800 focus-visible:ring-offset-2 disabled:opacity-50"
        >
          Look up
        </button>
      </form>
      <div
        id="recommendation-results"
        class="mt-3"
        aria-live="polite"
        aria-atomic="true"
      >
        {% include "_recommendations.html" %}
      </div>
    </section>
    <section aria-labelledby="status-heading">
      <h2 id="status-heading" class="sr-only">Job status</h2>
      <div
        id="status"
        hx-get="/partials/status"
        hx-trigger="load, every {{ refresh_interval_seconds|int }}s"
        hx-swap="innerHTML show:none"
      >
        {% include "_status.html" %}
      </div>
    </section>
  </main>
</body>
</html>
