<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Cicerone job architecture</title>
  <desc id="archDesc">Dataset or database input feeds job.run. Optional AutoML selects a candidate. The job builds a dataset, trains strategies, and writes to dataset or database output. An optional EventSource writes through to the same output.</desc>
  <defs>
    <linearGradient id="archFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fcff"/>
      <stop offset="100%" stop-color="#e6f4fa"/>
    </linearGradient>
    <linearGradient id="archArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4DB"/>
      <stop offset="100%" stop-color="#004B75"/>
    </linearGradient>
    <marker id="archHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#004B75"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="200" height="120" rx="8" fill="url(#archFill)" stroke="#004B75" stroke-opacity="0.25"/>
  <text x="120" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0a2438">Input</text>
  <text x="120" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">dataset parquet</text>
  <text x="120" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">or SQLAlchemy db</text>
  <line x1="220" y1="130" x2="290" y2="130" stroke="url(#archArrow)" stroke-width="2.5" marker-end="url(#archHead)"/>
  <rect x="296" y="50" width="360" height="160" rx="8" fill="url(#archFill)" stroke="#00B4DB" stroke-width="1.5"/>
  <text x="476" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0a2438">job.run</text>
  <text x="476" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">optional AutoML candidate pick</text>
  <text x="476" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">dataset.build_dataset</text>
  <text x="476" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">model.train_and_recommend</text>
  <line x1="656" y1="130" x2="726" y2="130" stroke="url(#archArrow)" stroke-width="2.5" marker-end="url(#archHead)"/>
  <rect x="732" y="70" width="208" height="120" rx="8" fill="url(#archFill)" stroke="#004B75" stroke-opacity="0.25"/>
  <text x="836" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0a2438">Output</text>
  <text x="836" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">parquet or db sink</text>
  <text x="836" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a6a82">+ EventSource write-through</text>
</svg>
