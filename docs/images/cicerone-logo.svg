<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4DB" />
      <stop offset="100%" stop-color="#004B75" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Icon Group -->
    <g transform="translate(40, 45)">
      <!-- The 'C' Shape -->
      <path d="M 115 50 
               A 55 55 0 1 0 115 110" 
            fill="none" 
            stroke="url(#cGrad)" 
            stroke-width="18" 
            stroke-linecap="round" />
      
      <!-- Inner accent line of the 'C' -->
      <path d="M 105 62 
               A 40 40 0 1 0 105 98" 
            fill="none" 
            stroke="#00E5FF" 
            stroke-width="4" 
            stroke-linecap="round" 
            opacity="0.7"/>

      <!-- The Arrow / Compass Pointer -->
      <path d="M 20 80 L 75 45 L 63 80 L 75 115 Z" 
            fill="url(#arrowGrad)" 
            stroke="#004B75" 
            stroke-width="4" 
            stroke-linejoin="round" />
      
      <!-- Back tail of the arrow passing through -->
      <path d="M 5 80 L 35 80" 
            fill="none" 
            stroke="#004B75" 
            stroke-width="6" 
            stroke-linecap="round" />
    </g>

    <!-- Typography -->
    <!-- Primary Brand Name -->
    <text x="210" y="125" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#002244">CICERONE</text>
    
    <!-- Tagline -->
    <text x="215" y="165" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="22" 
          font-weight="600" 
          letter-spacing="4" 
          fill="#004B75">GUIDING YOUR PATH</text>
  </g>
</svg>
