# CI-only stack: runs the pytest suite (>=95% coverage enforced by
# pyproject.toml) against a real, throwaway Postgres instance for the
# database-backend tests and tests/test_system_db*.py /
# tests/test_system_mixed*.py. Local parquet system specs
# (tests/test_system_dataset*.py, tests/test_system_events.py) do not
# need Postgres.
# Sequential extra tests run in `test-sequential` (rectools[torch]); the
# `test` and runtime images stay torch-free. Never used in production — see
# docker-compose.yml (which also ships a durable local `postgres` service
# for kind = "db" development).
#
# Credentials / DB names: docker/postgres/defaults.env (canonical).
# TEST_DATABASE_URL is assembled by tests/support/postgres_defaults.py from
# POSTGRES_TEST_HOST + that file — do not hand-build the URL here.
# MySQL (track store tests) follows the same split: docker/mysql/defaults.env,
# tests/support/mysql_defaults.py and MYSQL_TEST_HOST.

services:
  db-test:
    image: postgres:16-alpine
    env_file:
      - ./docker/postgres/defaults.env
    environment:
      # Override app DB — CI only needs the pytest database.
      POSTGRES_DB: ${POSTGRES_TEST_DB:-cicerone_test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data # throwaway, never persisted

  mysql-test:
    image: mysql:8.4
    env_file:
      - ./docker/mysql/defaults.env
    healthcheck:
      # Over TCP: the image's init server is socket-only, so this waits for the real one.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/mysql # throwaway, never persisted

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    env_file:
      - ./docker/postgres/defaults.env
    environment:
      # Hostname only — URL from support.postgres_defaults.resolve_test_database_url().
      POSTGRES_TEST_HOST: db-test
      MYSQL_TEST_HOST: mysql-test
      # Required by support.system_db.reset_schema before it will drop known tables.
      ALLOW_SCHEMA_RESET_FOR_TESTS: "1"
    depends_on:
      db-test:
        condition: service_healthy
      mysql-test:
        condition: service_healthy

  test-sequential:
    profiles: ["sequential"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test-sequential
    # No Postgres: RecTools sequential fits only. Isolated so torch is not
    # imported during the main suite (RecTools loads NN models when present).
